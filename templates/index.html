<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <title>Play</title>
</head>

<body>

    <header>

        <div class="user-profile-container">
            <div class="user-profile" id="user-profile-button">
                <span>👤</span>
                <span class="username">{{ username }}</span>
            </div>
            <div class="user-dropdown-div" id="user-dropdown">
                <button class="sign-out-btn" type="button" id="sign-out-button">Sign Out</button>
            </div>
        </div>

        <div class="brand">
            <h1>Jack Of All Games</h1>
        </div>

        <nav class="nav-menu" id="main-nav">
            <div class="nav-group">
                <button class="nav-btn active" data-view="play">Play</button>
                <button class="nav-btn" data-view="scoreboard">Scoreboard</button>
            </div>

            <div class="nav-group" id="play-nav">
                <button class="nav-btn active" data-view="join">Join Room</button>
                <button class="nav-btn" data-view="create">Create Room</button>
            </div>

            <div class="nav-group" id="scoreboard-nav">
                <button class="nav-btn active" data-view="wins">Wins</button>
                <button class="nav-btn" data-view="games">Games</button>
            </div>
        </nav>
    </header>

    <div id="play-card-group"> <!-- @Author Cam Clarke - enclosed create/join room cards in DIV -->

        <section class="card" id="create-room-card">
            <header class="create-card-header">
                <h3 class="card-title">Create Room</h3>
                <span class="card-room-id">| <span id="room-id">#RoomID</span></span>
            </header>

            <div class="form-section">
                <p class="form-section-title">Game</p>

                <div class="game-grid">
                    <label class="game-option">
                        <input type="radio" name="game_choice" value="poker" checked>
                        <span class="game-button-ish">Poker</span>
                    </label>

                    <label class="game-option">
                        <input type="radio" name="game_choice" value="war">
                        <span class="game-button-ish">War</span>
                    </label>

                    <label class="game-option">
                        <input type="radio" name="game_choice" value="blackjack">
                        <span class="game-button-ish">Blackjack</span>
                    </label>

                    <label class="game-option">
                        <input type="radio" name="game_choice" value="crazy8">
                        <span class="game-button-ish">Crazy Eights</span>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <p class="form-section-title">Configure</p>

                <div class="configure-row">
                    <span class="configure-label">Player Count</span>

                    <div class="configure-slider-container">
                        <input class="configure-slider" type="range" id="player-slider" name="player_count" min="2"
                            max="5" value="5">
                        <span id="player-count-display">4</span>
                    </div>
                </div>

                <div class="configure-row">
                    <span class="configure-label">Locked (Not Implemented)</span>

                    <div class="configure-locking-container">
                        <input class="password-box" id="password-input" type="password" name="room_password"
                            placeholder="Password">

                        <input class="lock-checkbox" type="checkbox" id="lock-toggle" name="is_locked" disabled>
                        <!-- @Cam "disabled because backend currently doesn't support this"-->
                    </div>
                </div>
            </div>

            <button class="submit-button" onclick="createRoom()" type="submit">Create Room</button>

        </section>

        <section class="card" id="join-room-card">
            <header class="join-card-header">
                <h3 class="card-title">Rooms</h3>
                <div class="join-header-controls">
                    <button class="nav-btn" type="button" id="refresh-button"
                        onclick="populateRoomList()">Refresh</button>
                    <input class="join-search" type="search" id="room-search" placeholder="Search">
                </div>
            </header>

            <div class="room-list scrollable-div" id="room-list">
                <div class="room-item">
                    <div class="room-info">
                        <span class="room-type">Loading</span>
                        <span class="card-room-id">| <span id="room-id">Loading</span></span>
                    </div>
                    <div class="room-icons">
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                    </div>
                    <button class="join-button" type="button">Join</button>
                </div>

                <div class="room-item">
                    <div class="room-info">
                        <span class="room-type">Loading</span>
                        <span class="card-room-id">| <span id="room-id">Loading</span></span>
                    </div>
                    <div class="room-icons">
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                    </div>
                    <button class="join-button" type="button">Join</button>
                </div>

                <div class="room-item">
                    <div class="room-info">
                        <span class="room-type">Loading</span>
                        <span class="card-room-id">| <span id="room-id">Loading</span></span>
                    </div>
                    <div class="room-icons">
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                        <span class="player-slot empty"></span>
                    </div>
                    <button class="join-button" type="button">Join</button>
                </div>
            </div>
        </section>
    </div>

    <!-- @Author Cam Clarke -->
    <!-- Cards for the scoreboard tab -->
    <div id="scoreboard-card-group">
        <section class="card" id="wins-card">
            <header class="wins-card-header">
                <h3 class="card-title">Scoreboard - Wins</h3>
            </header>
            <div id="wins-table" class="scrollable-div">

            </div>
        </section>

        <section class="card" id="games-card">
            <header class="games-card-header">
                <h3 class="card-title">Scoreboard - Games</h3>
            </header>
            <div id="games-table" class="scrollable-div">

            </div>
        </section>
    </div>
    <!-- End of @Author Cam Clarke -->
</body>

<script>

    // @Author Thomas McPhee
    // This is very bad, it is copied from utils.js
    // Ideally we should be importing frmo utils.js, but given this js is in <script> - we can't do that
    async function SendData(route, data) {
        const formData = new FormData();

        for (const [key, value] of Object.entries(data)) {
            formData.append(key, value);
        }

        let response = await fetch(route, { method: "POST", body: formData })
        response = await response.text()

        try {
            return await JSON.parse(response)
        } catch (error) {

            return await response
        }
    }

    /* --- Slider Logic --- */

    const slider = document.getElementById('player-slider');
    const countDisplay = document.getElementById('player-count-display');

    function sliderEventFunct() {
        // Update displayed player count
        const playerCount = slider.value;
        countDisplay.textContent = playerCount;
    }

    slider.addEventListener('input', sliderEventFunct);
    sliderEventFunct()


    /* --- Password Lock Logic --- */

    const lockToggle = document.getElementById('lock-toggle');
    const passwordBox = document.getElementById('password-input');
    passwordBox.style.display = 'none';

    lockToggle.addEventListener('change', function () {
        if (lockToggle.checked) {
            passwordBox.style.display = 'block';
            passwordBox.focus()
        }
        else {
            passwordBox.style.display = 'none';
        }
    });


    //
    // @Author Cam Clarke
    // functionality for showing rooms in the "join room" tab
    const room_list = document.getElementById("room-list")

    function createRoomItem(ROOM_TYPE, ROOM_ID, max_players, current_players) {

        let player_slots_html = '';
        let player_icons = [];

        for (let i = 0; i < max_players; i++) {
            if (i < current_players) {
                player_slots_html += '<span class="player-slot">\u{1F464}</span>';
            }
            else {
                player_slots_html += '<span class="player-slot empty"></span>';
            }
        }

        let template = `
        <div class="room-item" data-room-id="${ROOM_ID}">
            <div class="room-info">
            <span class="room-type">${ROOM_TYPE}</span>
            <span class="card-room-id">
                 |
                <span class="room-id">${ROOM_ID}</span>
            </span>
            </div>
            <div class="room-icons">
                ${player_slots_html}
            </div>
            <button class="join-button" type="button">Join</button>
        </div>
        `

        return template
    }


    async function populateRoomList() {
        rooms = await getRoomsFromServer()
        if (Object.keys(rooms).length == 0) {
            let _html = `
            <div style="height:10pc;"></div>
            <p style="justify-self: center;">No room available to join right now - Create One!</p>
            `
            room_list.innerHTML = _html
            return
        }

        let _html = ""

        for (let key in rooms) {
            let current_players = rooms[key]["current_players"]
            let max_players = rooms[key]["max_players"]
            let _room_type = rooms[key]["type"]
            let room_type = _room_type.charAt(0).toUpperCase() + _room_type.slice(1)
            let room_item = createRoomItem(room_type, key, max_players, current_players)
            _html += room_item
        }

        room_list.innerHTML = _html

        room_list.addEventListener("click", (event) => {
            const btn = event.target.closest(".join-button")
            if (!btn) { return }

            const roomItem = btn.closest(".room-item")
            const roomID = roomItem.dataset.roomId

            joinRoom(roomID)
        })
    }

    async function getRoomsFromServer() {
        // create some rooms for test data
        // for (let i = 0; i < 10; i++) {
        //     const postdata = new FormData();
        //     postdata.append("game_type", "war");
        //     postdata.append("num_players", "5");
        //     const response = await fetch("/create_room", {
        //         method: "POST",
        //         body: postdata,
        //     });
        // }

        const response = await fetch("/search_rooms");
        let data = await response.json();
        // let newdata = JSON.stringify(data, null, 2);
        return data
    }


    async function joinRoom(room_id) {
        const postdata = new FormData();
        postdata.append("room_id", room_id);
        const response = await fetch("/join_room", {
            method: "POST",
            body: postdata,
        });

        const data = await response.text()
        if (data.startsWith("success")) {
            window.location.href = "/room"
        }
    }


    // 
    // End of @Author Cam Clarke
    //

    //
    // @Author Thomas McPhee
    //

    async function createRoom() {
        // Selected game (radio)
        const gameChoice = document.querySelector('input[name="game_choice"]:checked').value;

        // Player count (range slider)
        const playerCount = document.getElementById('player-slider').value;

        // Lock checkbox
        const isLocked = document.getElementById('lock-toggle').checked;

        // Password (only relevant if locked)
        const password = document.getElementById('password-input').value;

        const formData = {
            game_type: gameChoice,
            num_players: Number(playerCount),
            // isLocked,
            // password: isLocked ? password : null
        };

        let response = await SendData("/create_room", formData)

        console.log(formData);

        if (response) {
            response = await SendData("/join_room", {
                "room_id": response
            })

            console.log(response)
            if (response.startsWith("success")) {
                window.location.href = "/room"
            }
        }
    }

    //
    // End of @author Thomas McPhee
    //

    /* --- Join Room Search Logic --- */

    const searchBar = document.getElementById('room-search');

    searchBar.addEventListener('input', function (event) {
        // Have to get room items upon input as the room items change their innerhtml from
        // 'loading' to 'roomcode' using async function
        let roomItems = document.querySelectorAll('.room-item');

        const searchValue = event.target.value.toLowerCase();

        // Loop over room items
        roomItems.forEach(function (room) {
            const roomText = room.querySelector('.room-id').textContent.toLowerCase();

            if (roomText.includes(searchValue)) {
                room.style.display = '';
            }
            else {
                room.style.display = 'none';
            }
        });
    });

    /* --- Refresh Button Active State --- */

    const refreshButton = document.getElementById('refresh-button');

    refreshButton.addEventListener('mousedown', function () {
        refreshButton.classList.add('active');
    });

    refreshButton.addEventListener('mouseup', function () {
        refreshButton.classList.remove('active');
    });


    /* --- Navigation Buttons Logic --- */

    const joinButton = document.querySelector('button[data-view="join"]');
    const createButton = document.querySelector('button[data-view="create"]');

    const joinCard = document.getElementById('join-room-card');
    const createCard = document.getElementById('create-room-card');

    function switchToJoin() {
        createCard.style.display = 'none';
        joinCard.style.display = '';

        populateRoomList()

        joinButton.classList.add('active');
        createButton.classList.remove('active');
    }

    function switchToCreate() {
        joinCard.style.display = 'none';
        createCard.style.display = '';

        joinButton.classList.remove('active');
        createButton.classList.add('active');
    }

    joinButton.addEventListener('click', switchToJoin);
    createButton.addEventListener('click', switchToCreate);

    // Default to 'Join Room' when page loads
    switchToJoin();


    //
    // @Author Cam Clarke
    // 
    const winsButton = document.querySelector('button[data-view="wins"]');
    const gamesButton = document.querySelector('button[data-view="games"]')

    const winsCard = document.getElementById('wins-card');
    const gamesCard = document.getElementById('games-card');

    function switchToWins() {
        gamesCard.style.display = 'none';
        winsCard.style.display = '';

        populateWinsTable();

        winsButton.classList.add('active');
        gamesButton.classList.remove('active');
    }

    function switchToGames() {
        gamesCard.style.display = '';
        winsCard.style.display = 'none';

        populateGamesTable();

        winsButton.classList.remove('active');
        gamesButton.classList.add('active');
    }

    winsButton.addEventListener('click', switchToWins);
    gamesButton.addEventListener('click', switchToGames);

    // Default to 'Wins' when page loads
    switchToWins()

    const playButton = document.querySelector('button[data-view="play"]');
    const scoreboardButton = document.querySelector('button[data-view="scoreboard"]');

    const playCardGroupDiv = document.getElementById('play-card-group');
    const scoreboardCardGroupDiv = document.getElementById('scoreboard-card-group');

    const playNav = document.getElementById('play-nav');
    const scoreboardNav = document.getElementById('scoreboard-nav')

    function switchToPlay() {
        playCardGroupDiv.style.display = '';
        scoreboardCardGroupDiv.style.display = 'none'

        playNav.style.display = '';
        scoreboardNav.style.display = 'none';

        playButton.classList.add('active');
        scoreboardButton.classList.remove('active');
    }

    function switchToScoreboard() {
        scoreboardCardGroupDiv.style.display = '';
        playCardGroupDiv.style.display = 'none';

        playNav.style.display = 'none';
        scoreboardNav.style.display = '';

        playButton.classList.remove('active');
        scoreboardButton.classList.add('active');
    }

    playButton.addEventListener('click', switchToPlay);
    scoreboardButton.addEventListener('click', switchToScoreboard);

    // Default to 'Play' when page loads
    switchToPlay();

    //
    // End of @Author Cam Clarke
    //


    /* --- User Menu Logic --- */

    const userButton = document.getElementById('user-profile-button');
    const userDropdown = document.getElementById('user-dropdown');
    const signOutButton = document.getElementById('sign-out-button');

    userButton.addEventListener('click', function (event) {
        event.stopPropagation() // To prevent the registration of multiple clicks
        if (userDropdown.style.display === 'block') {
            userDropdown.style.display = 'none';
        }
        else {
            userDropdown.style.display = 'block';
        }
    });

    // Hide dropdown if user clicks anywhere else
    document.addEventListener('click', function () {
        userDropdown.style.display = 'none';
    });

    if (signOutButton) {
        signOutButton.addEventListener('click', function () {
            window.location.replace("\\logout");
        });
    }

    // Hide dropdown when page loads
    userDropdown.style.display = 'none';

    //
    // @Author Cam Clarke
    //

    function populateWinsTable() {
        const winsTable = document.getElementById("wins-table")

        // Temporary until integrate with back end
        let playerName = "player"
        let score = 20
        let playerCount = 10

        let _html = ``
        for (i = 0; i < playerCount; i++) {
            let number = i + 1

            // Number spacing is so that all numbers take same 
            // width on screen for allignment purposes
            if (number < 10) {
                numberSpacing = "--"
            } else if (number < 100) {
                numberSpacing = "-"
            } else {
                numberSpacing = ""
            }
            let trophy = "&#127942" // trophy emoji
            let trophyClass = i < 3 ? "" : "scoreboard-trophy-hidden"
            let numberClass = i < 3 ? "scoreboard-number-top-3" : ""

            let template = `
            <div class="scoreboard-row">
                <div class="scoreboard-lhs">
                    <span class="${numberClass} scoreboard-number">${number}</span>
                    <span class="scoreboard-number-spacing">${numberSpacing}</span>
                    <span class="${trophyClass} scoreboard-trophy">${trophy}</span>
                    <span class="scoreboard-picture"></span>
                    <span class="scoreboard-name">${playerName}</span>
                </div>
                <div class="scoreboard-rhs">
                    <span class="scoreboard-score">${score}</span>
                </div>
            </div>
            `
            _html += template
        }
        winsTable.innerHTML = _html
    }

    function populateGamesTable() {
        const gamesTable = document.getElementById("games-table")
        // Temporary until integrate with back end
        let playerName = "player"
        let score = 20
        let playerCount = 10

        let _html = ``
        for (i = 0; i < playerCount; i++) {
            let number = i + 1

            // Number spacing is so that all numbers take same 
            // width on screen for allignment purposes
            if (number < 10) {
                numberSpacing = "--"
            } else if (number < 100) {
                numberSpacing = "-"
            } else {
                numberSpacing = ""
            }
            let trophy = "&#127942" // trophy emoji
            let trophyClass = i < 3 ? "" : "scoreboard-trophy-hidden"
            let numberClass = i < 3 ? "scoreboard-number-top-3" : ""

            // TODO - Implement profile picture. I was thinking default bitmap?
            let template = `
            <div class="scoreboard-row">
                <div class="scoreboard-lhs">
                    <span class="${numberClass} scoreboard-number">${number}</span>
                    <span class="scoreboard-number-spacing">${numberSpacing}</span>
                    <span class="${trophyClass} scoreboard-trophy">${trophy}</span>
                    <span class="scoreboard-picture"></span>
                    <span class="scoreboard-name">${playerName}</span>
                </div>
                <div class="scoreboard-rhs">
                    <span class="scoreboard-score">${score}</span>
                </div>
            </div>
            `
            _html += template
        }
        gamesTable.innerHTML = _html
    }

    //
    // End of @Author Cam Clarke
    //

</script>

</body>

</html>
