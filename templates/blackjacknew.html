<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack | {{code}}</title>
    <link rel="stylesheet" href="..\static\css\blackjack.css">
    <script src="..\static\games\blackjack.js" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- The SVG code draws an arc border, as well as the semicircular blackjack table with cross hatches (ai generated)-->
    <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>

            <!-- Felt fibre noise texture -->
            <filter id="felt" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.65 0.75" numOctaves="4" seed="2" result="noise" />
                <feColorMatrix type="saturate" values="0" in="noise" result="grey" />
                <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blended" />
                <feComponentTransfer in="blended">
                    <feFuncR type="linear" slope="0.85" />
                    <feFuncG type="linear" slope="0.92" />
                    <feFuncB type="linear" slope="0.85" />
                </feComponentTransfer>
            </filter>

            <!-- Tight crosshatch weave -->
            <pattern id="weave" x="0" y="0" width="1.2" height="1.2" patternUnits="userSpaceOnUse">
                <rect width="1.2" height="1.2" fill="none" />
                <line x1="0" y1="0.6" x2="1.2" y2="0.6" stroke="#1a5c2a" stroke-width="0.25" opacity="0.4" />
                <line x1="0.6" y1="0" x2="0.6" y2="1.2" stroke="#1a5c2a" stroke-width="0.25" opacity="0.4" />
            </pattern>

            <!-- Radial vignette -->
            <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
                <stop offset="40%" stop-color="transparent" />
                <stop offset="100%" stop-color="#071a0d" stop-opacity="0.7" />
            </radialGradient>

            <!-- Clip: everything above the arc -->
            <clipPath id="arcClip">
                <path d="M -5,30 Q 50,40 105,30 L 105,0 L -5,0 Z" />
            </clipPath>

        </defs>

        <!-- Base felt green -->
        <rect x="-5" y="0" width="110" height="45" fill="#1a6b30" clip-path="url(#arcClip)" />

        <!-- Woven crosshatch overlay -->
        <rect x="-5" y="0" width="110" height="45" fill="url(#weave)" clip-path="url(#arcClip)" />

        <!-- Noise/fibre filter layer -->
        <rect x="-5" y="0" width="110" height="45" fill="#1e7a36" opacity="0.6" filter="url(#felt)"
            clip-path="url(#arcClip)" />

        <!-- Vignette darkening at edges -->
        <rect x="-5" y="0" width="110" height="45" fill="url(#vignette)" clip-path="url(#arcClip)" />

        <!-- Gold border arc (wider, underneath) -->
        <path d="M -5,30 Q 50,40 105,30" stroke="#c9a84c" stroke-width="1.4" fill="none" />
        <!-- Black arc on top -->
        <path d="M -5,30 Q 50,40 105,30" stroke="black" stroke-width="1" fill="none" />

    </svg>

    <div class="table-div">
        <!-- Dealer Area -->
        <div class="dealer-area seat">
            <!-- <h3>Dealer</h3> --> <!-- TODO add this in CSS--> 
            <div id="dealer-hand" class="hand">
                <img src="https://deckofcardsapi.com/static/img/KH.png" class="OBJ_card self" alt="King of Hearts">
                <img src="https://deckofcardsapi.com/static/img/back.png" class="OBJ_card self" alt="Card back">
            </div>
        </div>

        <div class="seat p4">
            <h4 id="seat-p4">Player 4 - Empty</h4>
            <div id="hand-p4" class="hand p4">
                <img src="https://deckofcardsapi.com/static/img/5D.png" class="OBJ_card" alt="5 of Diamonds">
                <img src="https://deckofcardsapi.com/static/img/JC.png" class="OBJ_card" alt="Jack of Clubs">
                <img src="https://deckofcardsapi.com/static/img/9S.png" class="OBJ_card" alt="9 of Spades">
                <img src="https://deckofcardsapi.com/static/img/4C.png" class="OBJ_card" alt="4 of Clubs">
                <img src="https://deckofcardsapi.com/static/img/KD.png" class="OBJ_card" alt="King of Diamonds">
            </div>
        </div>

        <div class="seat p2">
            <h4 id="seat-p2">Player 2 - Empty</h4>
            <div id="hand-p2" class="hand p2">
                <!-- <img src="https://deckofcardsapi.com/static/img/AD.png" class="OBJ_card" alt="Ace of Diamonds">
                <img src="https://deckofcardsapi.com/static/img/7H.png" class="OBJ_card" alt="7 of Hearts">
                <img src="https://deckofcardsapi.com/static/img/0C.png" class="OBJ_card" alt="10 of Clubs">
                <img src="https://deckofcardsapi.com/static/img/6D.png" class="OBJ_card" alt="6 of Diamonds">
                <img src="https://deckofcardsapi.com/static/img/QS.png" class="OBJ_card" alt="Queen of Spades"> -->
            </div>
        </div>

        <div class="seat p1">
            <h4 id="seat-p1">You</h4>
            <div id="hand-p1" class="hand p1">
                <!-- <img src="https://deckofcardsapi.com/static/img/2C.png" class="OBJ_card self" alt="2 of Clubs">
                <img src="https://deckofcardsapi.com/static/img/QD.png" class="OBJ_card self" alt="Queen of Diamonds">
                <img src="https://deckofcardsapi.com/static/img/8H.png" class="OBJ_card self" alt="8 of Hearts">
                <img src="https://deckofcardsapi.com/static/img/3S.png" class="OBJ_card self" alt="3 of Spades"> -->
            </div>
        </div>
        <div class="seat p3">
            <h4 id="seat-p3">Player 3 - Empty</h4>
            <div id="hand-p3" class="hand p3">
                <img src="https://deckofcardsapi.com/static/img/KS.png" class="OBJ_card" alt="King of Spades">
                <img src="https://deckofcardsapi.com/static/img/5H.png" class="OBJ_card" alt="5 of Hearts">
                <img src="https://deckofcardsapi.com/static/img/JD.png" class="OBJ_card" alt="Jack of Diamonds">
                <img src="https://deckofcardsapi.com/static/img/7C.png" class="OBJ_card" alt="7 of Clubs">
                <img src="https://deckofcardsapi.com/static/img/AS.png" class="OBJ_card" alt="Ace">
            </div>
        </div>

        <div class=" seat p5">
            <h4 id="seat-p5">Player 5 - Empty</h4>
            <div id="hand-p5" class="hand p5">
                <img src="https://deckofcardsapi.com/static/img/4H.png" class="OBJ_card" alt="4 of Hearts">
                <img src="https://deckofcardsapi.com/static/img/6C.png" class="OBJ_card" alt="6 of Clubs">
                <img src="https://deckofcardsapi.com/static/img/0D.png" class="OBJ_card" alt="10 of Diamonds">
                <img src="https://deckofcardsapi.com/static/img/JS.png" class="OBJ_card" alt="Jack of Spades">
                <img src="https://deckofcardsapi.com/static/img/2H.png" class="OBJ_card" alt="2 of Hearts">
            </div>
        </div>
    </div>

    <!-- Game Status Box -->
    <div class="game-status">
        <p id="game-status-p">Waiting for server</p>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="btn btn-hit">Hit</button>
        <button class="btn btn-stand">Stand</button>
    </div>

</body>

</html>
