<!-- 
gamebase.html is the 'base class' for all html files for games (war.html, blackjack.html, etc)

game html files use %extends 'gamebase.html'% to 'inherit' from this file

gamebase automatically sets up:
 * a link to the game style sheet
 * gameboard div
 * a title (room code + game name)

provides a block called gameboardCustom, which each game file overrides to add custom elements (hands, decks, etc)

-->

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GameBase</title>
	<link rel="stylesheet" href="..\static\css\gamestyles.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" crossorigin="anonymous"></script>
</head>
<body>



<div id='DIV_gameContainer'>

	<h1 id="Title">GAME NAME | ROOM CODE</h1>
		
	<div id='DIV_gameBoard'>

		{% block gameboardCustom %}

		{% endblock %}

	</div>

</div>

</body>
</html>
