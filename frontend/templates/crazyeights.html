<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Eights | {{code}}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crazyeights.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/crazyeights/main.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="game-wrapper">
        
        <header id="game-header">
            <h2 id="status-text">Waiting for players...</h2>
            <p>Room: {{code}}</p>
            <button id="leave-button">Leave</button>
        </header>

        <main id="card-table">
            
            <div id="center-board">
                <div class="deck-area">
                    <img src="https://deckofcardsapi.com/static/img/back.png" class="card-image deck-card" alt="Draw Deck">
                </div>
                
                <div class="discard-area">
                    <div id="discard-pile"></div>
                </div>

                <div id="suit-indicator">
                    <span id="current-suit-icon">❓</span>
                </div>
            </div>

            <div class="player-area top-area hidden" id="area-top">
                <div class="player-info">
                    <span class="name" id="name-top">Empty</span>
                    <span class="score" id="score-top">0 pts</span>
                </div>
                <div class="opponent-hand" id="hand-top"></div>
            </div>

            <div class="player-area left-area hidden" id="area-left">
                <div class="player-info">
                    <span class="name" id="name-left">Empty</span>
                    <span class="score" id="score-left">0 pts</span>
                </div>
                <div class="opponent-hand" id="hand-left"></div>
            </div>

            <div class="player-area right-area hidden" id="area-right">
                <div class="player-info">
                    <span class="name" id="name-right">Empty</span>
                    <span class="score" id="score-right">0 pts</span>
                </div>
                <div class="opponent-hand" id="hand-right"></div>
            </div>

            <div class="player-area bottom-area" id="area-bottom">
                <div class="player-info bottom-info">
                    <span class="name" id="name-bottom">You</span>
                    <span class="score" id="score-bottom">0 pts</span>
                </div>
                <div class="bottom-hand" id="hand-bottom"></div>
            </div>

        </main>

        <div id="suit-picker" class="hidden">
            <div class="picker-div">
                <h3>Choose a Suit</h3>
                <div class="suit-buttons">
                    <button class="suit-button red" data-suit="H">♥️ Hearts</button>
                    <button class="suit-button red" data-suit="D">♦️ Diamonds</button>
                    <button class="suit-button black" data-suit="C">♣️ Clubs</button>
                    <button class="suit-button black" data-suit="S">♠️ Spades</button>
                </div>
            </div>
        </div>

        <div id="game-end-popup" class="game-end-screen hidden">
            <div class="game-end-content">
                <h2 id="game-winner-text"></h2>
                <hr>
                <h3>Final Scores</h3>
                <ul id="game-scores-list"></ul>
            </div>
        </div>

    </div>
</body>
</html>
